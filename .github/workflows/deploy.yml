name: Deploy Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug and Clean Deployment
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🛑 PARANDO TODOS LOS SERVICIOS..."
          pm2 delete all || true
          pkill -f node || true
          pkill -f server.js || true
          
          echo "🧹 LIMPIANDO DIRECTORIOS..."
          rm -rf ~/app-blue/* ~/app-green/* ~/app/* ~/server/* /tmp/app* /home/*/app*
          
          echo "🔍 BUSCANDO ARCHIVOS server.js OCULTOS:"
          find /home -name "server.js" -delete 2>/dev/null || true
          find /root -name "server.js" -delete 2>/dev/null || true
          find /tmp -name "server.js" -delete 2>/dev/null || true

    - name: Copy Fresh Code
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "~/app-source"
        strip_components: 1

    - name: Deploy Fresh Application
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "📦 COPIANDO CÓDIGO NUEVO..."
          # Crear directorios limpios
          mkdir -p ~/app-blue ~/app-green
          
          # Copiar archivos NUEVOS
          cp -r ~/app-source/* ~/app-blue/
          cp -r ~/app-source/* ~/app-green/
          
          # Instalar dependencias
          cd ~/app-blue && npm install --production
          cd ~/app-green && npm install --production
          
          echo "🚀 INICIANDO APLICACIÓN NUEVA..."
          # Forzar el uso del nuevo código
          cd ~/app-blue
          ENVIRONMENT=blue PORT=3000 pm2 start server.js --name "app-blue"
          cd ~/app-green  
          ENVIRONMENT=green PORT=3001 pm2 start server.js --name "app-green"
          
          # Guardar configuración PM2
          pm2 save
          
          echo "✅ VERIFICACIÓN FINAL:"
          pm2 list
          echo ""
          echo "📄 CONTENIDO DE server.js EN BLUE:"
          cat ~/app-blue/server.js
