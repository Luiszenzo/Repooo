name: Deploy Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Crear directorio temporal con el nuevo código
          DEPLOY_DIR="/tmp/deploy-$(date +%s)"
          echo "📦 Preparando despliegue en: $DEPLOY_DIR"
          
          mkdir -p $DEPLOY_DIR
          
          # Copiar todo el código del repositorio al servidor
          tar -czf - . | ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "tar -xzf - -C $DEPLOY_DIR"
          
          echo "✅ Código copiado al servidor"
          
          # Detectar ambiente actual
          CURRENT_ENV=$(curl -s http://localhost:3000 || echo "unknown")
          if [[ "$CURRENT_ENV" == *"blue"* ]]; then
            CURRENT_ENV="blue"
          elif [[ "$CURRENT_ENV" == *"green"* ]]; then
            CURRENT_ENV="green"
          else
            CURRENT_ENV="unknown"
          fi
          
          echo "🎯 Ambiente actual detectado: $CURRENT_ENV"
          
          if [ "$CURRENT_ENV" = "blue" ]; then
            echo "🟢 Desplegando en GREEN..."
            ~/scripts/switch-to-green.sh "${{ secrets.PASSWORD }}" "$DEPLOY_DIR"
          else
            echo "🔵 Desplegando en BLUE..."
            ~/scripts/switch-to-blue.sh "${{ secrets.PASSWORD }}" "$DEPLOY_DIR"
          fi
