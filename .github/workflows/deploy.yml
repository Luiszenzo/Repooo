name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd src && npm install
      - name: Build Docker image
        run: cd src && docker build -t blue-green-demo .
      # Add deployment steps her
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /path/to/your/app
            git pull origin main
            docker stop blue-green-demo || true
            docker rm blue-green-demo || true
            docker build -t blue-green-demo .
            docker run -d --name blue-green-demo -p 80:80 blue-green-demo
