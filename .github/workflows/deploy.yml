name: Deploy Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Crear directorio temporal para los nuevos archivos
          mkdir -p ~/new-deployment
          
          # Usar SCP para copiar TODOS los archivos desde GitHub
          # Esto sobreescribirá completamente los archivos existentes
          echo "📦 Copiando archivos desde GitHub..."
          
          # Primero eliminar archivos antiguos en ambos ambientes
          echo "🧹 Limpiando archivos antiguos..."
          rm -rf ~/app-blue/*
          rm -rf ~/app-green/*
          
          # Crear archivo tar con todo el contenido del repo
          tar -czf /tmp/app-from-github.tar.gz .
          
          # Copiar el tar al VPS
          scp -o StrictHostKeyChecking=no /tmp/app-from-github.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/new-deployment/
          
          # Extraer en ambos ambientes
          echo "📁 Extrayendo archivos nuevos..."
          tar -xzf ~/new-deployment/app-from-github.tar.gz -C ~/app-blue/
          tar -xzf ~/new-deployment/app-from-github.tar.gz -C ~/app-green/
          
          # Instalar dependencias
          echo "📦 Instalando dependencias..."
          cd ~/app-blue && npm install --production
          cd ~/app-green && npm install --production
          
          # Limpiar
          rm -rf ~/new-deployment
          rm -f /tmp/app-from-github.tar.gz
          
          # Detectar ambiente actual y desplegar en el opuesto
          CURRENT_ENV=$(curl -s http://localhost | grep -o '"environment":"[^"]*' | cut -d'"' -f4 2>/dev/null || echo "unknown")
          echo "Ambiente actual detectado: $CURRENT_ENV"
          
          if [ "$CURRENT_ENV" = "blue" ]; then
            echo "🔄 Desplegando en GREEN..."
            ~/scripts/switch-to-green.sh "${{ secrets.PASSWORD }}"
          else
            echo "🔄 Desplegando en BLUE..."
            ~/scripts/switch-to-blue.sh "${{ secrets.PASSWORD }}"
          fi
